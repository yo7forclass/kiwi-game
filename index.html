<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奇異鳥組別養成管理系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Confetti JS -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        @keyframes bounce-cute {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.03); }
        }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-3px) rotate(-1.5deg); }
            50% { transform: translateX(3px) rotate(1.5deg); }
            75% { transform: translateX(-3px) rotate(-1.5deg); }
            100% { transform: translateX(0); }
        }
        .kiwi-float { animation: float 3s ease-in-out infinite; }
        .kiwi-happy { animation: bounce-cute 0.6s ease-in-out infinite; }
        .kiwi-hungry { animation: shake 0.3s ease-in-out infinite; }
    </style>
</head>
<body class="bg-gradient-to-br from-emerald-50 via-teal-50 to-green-100 min-h-screen flex flex-col text-slate-800">

    <!-- 頂部導覽列 -->
    <header class="bg-emerald-800 text-white shadow-md py-3 px-6 flex flex-wrap justify-between items-center z-20">
        <div class="flex items-center space-x-3">
            <div class="bg-emerald-600 p-2.5 rounded-2xl shadow-inner">
                <svg class="w-8 h-8 text-amber-200" viewBox="0 0 24 24" fill="currentColor">
                    <circle cx="12" cy="12" r="10" fill="#FBBF24"/>
                    <path d="M8 14c2 2 6 2 8 0" stroke="#78350F" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="9" cy="10" r="1.5" fill="#78350F"/>
                    <circle cx="15" cy="10" r="1.5" fill="#78350F"/>
                    <path d="M12 2v4m-3-2h6" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-black tracking-wider">
                    奇異鳥組別養成管理系統
                </h1>
                <p class="text-xs text-emerald-200">Kiwi Bird Virtual Pet & Group Leaderboard</p>
            </div>
        </div>

        <div class="flex items-center space-x-3 mt-2 sm:mt-0">
            <div id="decayStatusBadge" class="bg-emerald-700/80 border border-emerald-600 text-amber-200 text-xs px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span id="decayBadgeText">每 24 小時扣心</span>
            </div>

            <button onclick="toggleSound()" id="soundBtn" class="bg-emerald-700 hover:bg-emerald-600 text-white p-2.5 rounded-xl transition shadow flex items-center gap-1.5 text-sm font-bold" title="音效開關">
                🔊 <span class="hidden md:inline">音效</span>
            </button>
            <button onclick="handleViewSwitch()" id="viewToggleBtn" class="bg-amber-400 hover:bg-amber-300 text-emerald-950 px-4 py-2 rounded-xl transition shadow font-bold flex items-center gap-2 text-sm">
                👑 進入管理員模式
            </button>
        </div>
    </header>

    <!-- 公告提示橫幅 -->
    <div class="bg-white/80 backdrop-blur border-b border-emerald-100 px-6 py-2.5 text-sm text-emerald-900 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2 truncate">
            <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="announcementText">歡迎來到奇異鳥養成園區！點擊「餵食」可隨時補充愛心與飽食度！</span>
        </div>
        <span class="text-xs text-slate-400 shrink-0 hidden sm:inline">自動保存已啟用</span>
    </div>

    <!-- 主要內容區 -->
    <main class="flex-grow container mx-auto px-4 py-6 max-w-7xl">
        
        <!-- 學生看板視圖 -->
        <div id="studentView" class="space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-black text-emerald-900 flex items-center gap-2">
                    <span>🌱 班級小組養成現況</span>
                </h2>
                <div class="text-sm font-bold text-emerald-700 bg-emerald-100 px-4 py-1.5 rounded-full">
                    照顧好你的奇異鳥，贏得班級榮譽！
                </div>
            </div>

            <!-- 6組卡片動態生成網格 -->
            <div id="groupsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- 動態注入 -->
            </div>
        </div>

        <!-- 管理員控制台視圖 -->
        <div id="adminView" class="hidden space-y-6">
            <!-- 密碼解鎖層 -->
            <div id="adminLoginSection" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl border border-emerald-100 text-center mt-12">
                <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">🔐</div>
                <h3 class="text-xl font-bold text-slate-800 mb-2">請輸入管理員密碼</h3>
                <p class="text-sm text-slate-500 mb-6">預設密碼為：<span class="font-mono bg-slate-100 px-2 py-1 rounded text-emerald-600 font-bold">1234</span> (或直接點擊登入)</p>
                <input type="password" id="adminPinInput" placeholder="輸入密碼..." class="w-full px-4 py-3 border border-slate-300 rounded-xl mb-4 text-center text-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <button onclick="verifyAdminPin()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-md">
                    解鎖管理員模式
                </button>
                <button onclick="handleViewSwitch()" class="mt-3 text-sm text-slate-500 hover:underline">返回學生看板</button>
            </div>

            <!-- 解鎖後的管理面板 -->
            <div id="adminPanelContent" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-md border border-emerald-100 flex flex-wrap justify-between items-center gap-4">
                    <div>
                        <h3 class="text-xl font-black text-emerald-900">🛠️ 管理員控制中心</h3>
                        <p class="text-sm text-slate-500">快速加扣分、餵食、自訂組名、調整時間週期與喚醒沉睡奇異鳥。</p>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="batchAddScore(1)" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-sm font-bold shadow transition">全體 +1 分</button>
                        <button onclick="resetAllData()" class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow transition">重置所有資料</button>
                    </div>
                </div>

                <!-- 系統設定列 -->
                <div class="bg-white p-6 rounded-2xl shadow-md border border-emerald-100 grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">⏱️ 飽食度扣心週期設定 (預設 24 小時)：</label>
                        <select id="decayRateSelect" onchange="changeDecayRate(this.value)" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="86400000">標準模式 (每 24 小時扣 1 心)</option>
                            <option value="172800000">放鬆模式 (每 48 小時扣 1 心)</option>
                            <option value="3600000">快速模式 (每 1 小時扣 1 心 - 示範用)</option>
                            <option value="10000">超快測試模式 (每 10 秒扣 1 心)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">📢 公告欄訊息自訂：</label>
                        <div class="flex gap-2">
                            <input type="text" id="announcementInput" placeholder="輸入公告內容..." class="flex-grow px-4 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <button onclick="updateAnnouncement()" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2.5 rounded-xl font-bold text-sm">更新</button>
                        </div>
                    </div>
                </div>

                <!-- 各組精細管理列表 -->
                <div class="bg-white p-6 rounded-2xl shadow-md border border-emerald-100">
                    <h4 class="text-lg font-bold text-slate-800 mb-4">✨ 小組快速管理與餵食操作</h4>
                    <div id="adminGroupsList" class="space-y-4">
                        <!-- 動態生成管理列 -->
                    </div>
                </div>

                <!-- 歷史紀錄 -->
                <div class="bg-white p-6 rounded-2xl shadow-md border border-emerald-100">
                    <h4 class="text-lg font-bold text-slate-800 mb-3">📜 最近加扣分與互動紀錄</h4>
                    <div id="logsContainer" class="bg-slate-50 p-4 rounded-xl max-h-48 overflow-y-auto text-xs font-mono space-y-1.5 text-slate-600">
                        <!-- 紀錄 -->
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- 頁尾 -->
    <footer class="bg-emerald-900 text-emerald-200 text-center py-4 text-xs mt-auto">
        奇異鳥組別養成管理系統 &copy; 2026 | 課堂互動 & 團隊點數獎勵平台
    </footer>

    <!-- JavaScript 邏輯 -->
    <script>
        // 資料結構定義
        let groups = [
            { id: 1, name: "第一組", score: 12, hearts: 5, lastFedTime: Date.now(), isSleeping: false, color: "#10B981", accessory: "👑 皇冠" },
            { id: 2, name: "第二組", score: 8, hearts: 4, lastFedTime: Date.now(), isSleeping: false, color: "#3B82F6", accessory: "👓 智慧眼鏡" },
            { id: 3, name: "第三組", score: 15, hearts: 5, lastFedTime: Date.now(), isSleeping: false, color: "#EC4899", accessory: "🎀 優雅領結" },
            { id: 4, name: "第四組", score: 10, hearts: 3, lastFedTime: Date.now(), isSleeping: false, color: "#F59E0B", accessory: "🍀 幸運草" },
            { id: 5, name: "第五組", score: 6, hearts: 2, lastFedTime: Date.now(), isSleeping: false, color: "#8B5CF6", accessory: "🌸 小花髮飾" },
            { id: 6, name: "第六組", score: 14, hearts: 5, lastFedTime: Date.now(), isSleeping: false, color: "#06B6D4", accessory: "🧣 帥氣斗篷" }
        ];

        let settings = {
            decayInterval: 86400000, // 預設 24 小時
            soundEnabled: true,
            announcement: "歡迎來到奇異鳥養成園區！點擊「餵食」可隨時補充愛心與飽食度！"
        };

        let logs = [];
        let isAdminLoggedIn = false;
        let currentView = 'student';

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            loadData();
            checkDecay();
            renderUI();
            setInterval(checkDecay, 1000); // 每秒檢查時間與更新倒數
        });

        // 讀取 localStorage
        function loadData() {
            const savedGroups = localStorage.getItem('kiwi_groups_v4');
            const savedSettings = localStorage.getItem('kiwi_settings_v4');
            const savedLogs = localStorage.getItem('kiwi_logs_v4');

            if (savedGroups) groups = JSON.parse(savedGroups);
            if (savedSettings) settings = JSON.parse(savedSettings);
            if (savedLogs) logs = JSON.parse(savedLogs);

            document.getElementById('decayRateSelect').value = settings.decayInterval;
            document.getElementById('announcementText').innerText = settings.announcement;
            document.getElementById('announcementInput').value = settings.announcement;
            updateDecayBadgeText();
        }

        // 儲存至 localStorage
        function saveData() {
            localStorage.setItem('kiwi_groups_v4', JSON.stringify(groups));
            localStorage.setItem('kiwi_settings_v4', JSON.stringify(settings));
            localStorage.setItem('kiwi_logs_v4', JSON.stringify(logs));
        }

        // 檢查飽食度扣心
        function checkDecay() {
            const now = Date.now();
            let updated = false;

            groups.forEach(group => {
                if (group.isSleeping) return;
                const elapsed = now - group.lastFedTime;
                const intervalsPassed = Math.floor(elapsed / settings.decayInterval);

                if (intervalsPassed > 0) {
                    group.hearts = Math.max(0, group.hearts - intervalsPassed);
                    group.lastFedTime += intervalsPassed * settings.decayInterval; 
                    if (group.hearts === 0) {
                        group.isSleeping = true;
                        addLog(`💤 ${group.name} 的奇異鳥因為飢餓過久進入沉睡狀態！`);
                    } else {
                        addLog(`⚠️ ${group.name} 肚子餓了，扣掉 1 顆心！`);
                    }
                    updated = true;
                }
            });

            if (updated) {
                saveData();
                renderUI();
            } else {
                updateTimersDisplay();
            }
        }

        // 渲染整體介面
        function renderUI() {
            renderStudentView();
            if (isAdminLoggedIn) {
                renderAdminPanelList();
                renderLogs();
            }
        }

        // 繪製學生
